# Configuración de Nginx para el sistema municipal.
#
# ANTES DE USARLO: reemplaza TU_DOMINIO por el dominio real en las 4 líneas
# que lo tienen (por ejemplo munisanpablojocopilas.gob.gt).
#
# Instalación (en el servidor):
#   sudo cp nginx-muni.conf /etc/nginx/sites-available/muni
#   sudo ln -s /etc/nginx/sites-available/muni /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d TU_DOMINIO -d www.TU_DOMINIO -d api.TU_DOMINIO
#
# Certbot agrega solo la parte de HTTPS (certificado gratuito de Let's
# Encrypt) y lo renueva automáticamente.

# www.TU_DOMINIO -> TU_DOMINIO (una sola dirección oficial; además el
# backend solo acepta peticiones del origen configurado en FRONTEND_ORIGIN)
server {
    listen 80;
    server_name www.TU_DOMINIO;
    return 301 https://TU_DOMINIO$request_uri;
}

# Sitio público y panel administrativo (Next.js en el puerto 3000)
server {
    listen 80;
    server_name TU_DOMINIO;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# API (Express en el puerto 4000)
server {
    listen 80;
    server_name api.TU_DOMINIO;

    # Los documentos de trámites pueden pesar hasta 10 MB. Sin esta línea
    # Nginx rechaza cualquier archivo de más de 1 MB.
    client_max_body_size 12M;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
